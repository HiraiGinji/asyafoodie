<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">    <style>
        .navbar-withcss {
            position: sticky;
            top: 0;
            background-color: #9c0f0f;
            color: white;
            z-index: 1000;
        }

        .navbar-content {
            position: relative;
            z-index: 1;
        }

        .navbar-toptext {
            font-weight: bold;
            font-size: 30px;
            letter-spacing: 1px;
            color: white;
        }

        .nav-link {
            color: white !important;
            text-transform: uppercase;
            position: relative;
            transition: color 0.3s;
            font-size: 17px;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: white;
            transition: width 0.3s ease-in-out;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-link:hover {
            color: #ffcba4 !important;
        }

        .contact-info {
            font-size: 14px;
        }

        .welcome-section {
            padding: 20px;
        }

        .welcome-heading {
            color: #000000;
            font-size: 40px;
        }

        .welcome-heading1 {
            color: #9c0f0f;
            font-size: 40px;
        }

        .navigate-section {
            background-color: #000000;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .grid-container {
            background-color: black;
            padding: 80px;
        }

        .grid-item {
            background-color: #9c0f0f;
            height: 300px;
            border-radius: 5px;
        }

        .footer {
            background-color: #9c0f0f;
            color: white;
            padding: 30px 20px;
        }

        .footer-heading {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .footer-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-list-item {
            margin-bottom: 8px;
        }

        .footer-link {
            color: white;
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="navbar-withcss">
        <div class="container-xxl navbar-content">
            <div class="row">
                <div class="col-12 text-start contact-info" style="font-size: 15px;">
                    +63 545 329 9273

            </div>

                        <li class="nav-item"><a class="nav-link px-3" href="#">Restaurant</a></li>
                        <li class="nav-item"><a class="nav-link px-3" href="recipe.html">Recipe</a></li>
                        <li class="nav-item"><a class="nav-link px-3" href="#">Guides</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid grid-container">

            </div>
            <div class="col-md-3">

            <div class="col-md-3">
