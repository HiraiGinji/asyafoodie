                    <h1 class="hero-title">Lágrima San Juan</h1>
                    <p class="hero-subtitle">
                        Lágrima San Juan opened its doors in 2016 with a clear mission: to bring the vibrant flavors of Los Angeles' Mexican cuisine to the heart of Manila. Situated in the bustling Salcedo area of Makati, the restaurant quickly established itself as a neighborhood favorite, offering a welcoming spot for sharing good food and honest conversations. With a commitment to quality, Lagrima prides itself on crafting almost everything in-house and sourcing ingredients locally whenever possible, ensuring a fresh and authentic taste in every dish they serve.</p>
                    <p class="hero-subtitle">
                        From its bright and inviting interior to its creatively adventurous menu, Lagrima aimed to provide a memorable dining experience that goes beyond traditional Mexican fare. By incorporating innovative twists, such as the popular Kimchi Quesadilla, alongside beloved classics like their Carnitas Nachos, Lagrima carved out a unique niche in Manila's culinary scene. The "Knights of the Round" taco platter further exemplifies their dedication to showcasing a diverse range of flavors and preparations, solidifying Lagrima's reputation as a hip and exciting destination for Mexican food enthusiasts seeking both comfort and culinary exploration.</p>
                    <div class="d-flex flex-wrap justify-content-center justify-content-md-start">
                    </div>
                </div>                    
                <div class="col-lg-6 col-md-12 d-flex justify-content-center align-items-center mt-4 mt-lg-0">
                    <div class="carousel-container">
                        <div class="slider">
                            <div class="list">
                                <div class="item active">
                                    <img src="Images/Quesadilla.png" alt="Mämmi">
                                    <div class="circle"></div>
                                </div>
                                <div class="item">
                                    <img src="Images/Burrito.png" alt="Yakitori">
                                </div>
                                <div class="item">
                                    <img src="Images/Nachos.png" alt="Mochi">
                                </div>
                            </div>
                            <button id="prev" class="nav-btn">&#10094;</button>
                            <button id="next" class="nav-btn">&#10095;</button>
                        </div>
                        <div class="description-box" id="description1">
                            <h4>Quesadilla</h4>
                            <p>Served on a clean white plate, the presentation is simple yet inviting, allowing the quality of the ingredients and the skill of the preparation to shine. It's a taste of authentic Mexican warmth.</p>
                        </div>
                        <div class="description-box" id="description2">
                            <h4>Buritto</h4>
                            <p>Served simply on a cool-toned plate, the focus remains on the bright colors and textures of the burrito itself. It’s a portable taste of the sun-kissed flavors of Mexico.</p>
                        </div>
                        <div class="description-box" id="description3">
                            <h4>Nachos</h4>
                            <p>This dish is crowned with a generous helping of bright pink pickled onions, adding a tangy counterpoint to the richness below. Fresh cilantro leaves provide a touch of green and a burst of herbaceous aroma.
                                Served on a stylish blue plate, these nachos are a celebration of Mexican zest and abundance.</p>
                        </div>
                    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const list = document.querySelector('.list');
            const prev = document.getElementById('prev');
            const next = document.getElementById('next');
            const items = document.querySelectorAll('.list .item');
            const count = items.length;
            let active = 0;
            let itemWidth = items[0].offsetWidth + 30;
            
            const circleTexts = [
                "Lágrima San Juan • Menu • Quesadilla • ",
                "Lágrima San Juan • Menu • Buritto • ",
                "Lágrima San Juan • Menu • Nachos • "
            ];
            
            document.getElementById('description1').style.display = 'block';
            
            centerActiveItem();
            
            window.addEventListener('resize', function() {
                itemWidth = items[0].offsetWidth + 30;
                centerActiveItem();
            });
            
            next.addEventListener('click', () => {
                if (active >= count - 1) return;
                active++;
                updateCarousel();
            });
            
            prev.addEventListener('click', () => {
                if (active <= 0) return;
                active--;
                updateCarousel();
            });
            
            function centerActiveItem() {
                const containerWidth = document.querySelector('.carousel-container').offsetWidth;
                const centerPosition = (containerWidth / 2) - (itemWidth / 2);
                const offset = centerPosition - (active * itemWidth);
                list.style.transform = `translateX(${offset}px)`;
            }
            
            function updateCarousel() {
                document.querySelectorAll('.description-box').forEach(box => {
                    box.style.display = 'none';
                });
                
                document.getElementById(`description${active+1}`).style.display = 'block';
                
                items.forEach(item => item.classList.remove('active'));
                items[active].classList.add('active');
                
                items.forEach(item => {
                    const oldCircle = item.querySelector('.circle');
                    if (oldCircle) oldCircle.remove();
                });
                
                const newCircle = document.createElement('div');
                newCircle.className = 'circle';
                const currentText = circleTexts[active];
                currentText.split('').forEach((char, key) => {
                    const newSpan = document.createElement("span");
                    newSpan.innerText = char;
                    const rotateDeg = (360 / currentText.length) * key;
                    newSpan.style.setProperty('--rotate', rotateDeg + 'deg');
                    newCircle.appendChild(newSpan);
                });
                items[active].appendChild(newCircle);
                
                centerActiveItem();
                
                prev.style.display = active === 0 ? 'none' : 'block';
                next.style.display = active === count - 1 ? 'none' : 'block';
            }
            
            updateCarousel();
        });
    </script>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('show');
        }
    </script>
